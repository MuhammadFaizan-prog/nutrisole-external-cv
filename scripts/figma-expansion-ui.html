<!doctype html>
<html><head><meta charset="utf-8"><style>
body{font:13px/1.5 system-ui;color:var(--figma-color-text);background:var(--figma-color-bg);margin:20px}h1{font-size:18px}button{padding:10px 16px;border:0;border-radius:6px;color:var(--figma-color-text-onbrand);background:var(--figma-color-bg-brand);cursor:pointer;margin:3px}button:disabled{opacity:.5}pre{white-space:pre-wrap;max-height:180px;overflow:auto;font:11px/1.5 monospace}select{max-width:100%;padding:6px}a{color:var(--figma-color-text-brand);display:block;padding:6px}
</style></head><body><h1>NutriSole editable flows</h1><p>30 additional screens, a flow directory, portion confirmation and interaction states. Preserves the original six. Recovery retains the unfinished attempt in a hidden archive.</p><button id="run">Create / recover design</button><button id="inspect">Inspect live design</button><button id="export">Export QA frames</button><select id="frames" aria-label="Focus a screen"><option>Focus a screen…</option></select><a id="download" style="display:none">Save live QA bundle</a><a id="report" style="display:none">Save validation report</a><pre id="status">Ready. No network access is used.</pre><script>
const payload = /* PAYLOAD */;
const refineButton=document.createElement('button');refineButton.textContent='Refine icon sizes';refineButton.id='refine';document.getElementById('export').after(refineButton);refineButton.onclick=()=>send({type:'refine',payload});
const send=m=>parent.postMessage({pluginMessage:m},'*');
document.getElementById('run').onclick=()=>{document.getElementById('run').disabled=true;document.getElementById('status').textContent='Creating editable layers…';send({type:'build',payload})};
document.getElementById('inspect').onclick=()=>send({type:'inspect'});
document.getElementById('export').onclick=()=>send({type:'export-qa'});
document.getElementById('frames').onchange=e=>send({type:'focus',id:e.target.value});
function download(id,filename,bytes,type){const a=document.getElementById(id);a.href=URL.createObjectURL(new Blob([bytes],{type}));a.download=filename;a.style.display='block'}
function zip(files){const parts=[],central=[];let offset=0;const u16=n=>[n&255,n>>>8&255],u32=n=>[n&255,n>>>8&255,n>>>16&255,n>>>24&255];const enc=new TextEncoder();const crc=bytes=>{let c=0xffffffff;for(const b of bytes){c^=b;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0};for(const f of files){const name=[...enc.encode(f.name)],bytes=new Uint8Array(f.bytes),sum=crc(bytes);const header=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(sum),...u32(bytes.length),...u32(bytes.length),...u16(name.length),...u16(0),...name]);parts.push(header,bytes);central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(sum),...u32(bytes.length),...u32(bytes.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...name]));offset+=header.length+bytes.length}const size=central.reduce((n,b)=>n+b.length,0);return new Blob([...parts,...central,new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(size),...u32(offset),...u16(0)])],{type:'application/zip'})}
onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;
 if(m.type==='qa-files'){m.files.push({name:'live-figma-report.json',bytes:[...new TextEncoder().encode(JSON.stringify(m.report,null,2))]});const a=document.getElementById('download');a.href=URL.createObjectURL(zip(m.files));a.download=m.report.iconScalingRefined?'NutriSole-live-Figma-QA-v2.zip':'NutriSole-live-Figma-QA.zip';a.style.display='block';document.getElementById('status').textContent='32 live native-frame PNG exports ready. They are QA artifacts; the Figma designs remain editable.';return}
 document.getElementById('status').textContent=JSON.stringify(m,null,2);
 if(m.type==='complete'||m.type==='inspection'){document.getElementById('run').disabled=m.status==='complete'||m.type==='complete';download('report','NutriSole-live-validation.json',JSON.stringify(m,null,2),'application/json');if(m.frames){const s=document.getElementById('frames');s.replaceChildren(new Option('Focus a screen…',''));for(const f of m.frames)s.add(new Option(f.title,f.id))}}
 else if(m.type==='error')document.getElementById('run').disabled=false;
};
</script></body></html>
